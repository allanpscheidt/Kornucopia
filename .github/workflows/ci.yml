name: Build and verify Kornucopia

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Prepare draft release v1.0.3 with verified assets
        type: boolean
        default: false
        required: false

permissions:
  contents: read

jobs:
  macos:
    name: macOS Apple Silicon
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require Apple Silicon
        run: test "$(uname -m)" = arm64
      - name: Audit public files
        run: python3 scripts/audit-publication.py --check-index
      - name: Build, test and inspect release
        run: ./scripts/package-release.sh
      - name: Upload verified macOS release files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Kornucopia-1.0.3-macOS-arm64
          path: |
            dist/Kornucopia-v1.0.3-macOS-arm64.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          include-hidden-files: false

  windows:
    name: Windows portable (${{ matrix.arch }})
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            rid: win-x64
            pe_machine: 34404
          - arch: arm64
            rid: win-arm64
            pe_machine: 43620
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Audit public files
        run: python scripts/audit-publication.py --check-index
      - name: Test persistence, WIP and localization
        if: matrix.arch == 'x64'
        run: |
          dotnet run --project Windows/Tests/Kornucopia.Core.Tests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Core tests failed.' }
      - name: Publish self-contained portable app
        env:
          KORNUCOPIA_RID: ${{ matrix.rid }}
        run: |
          $output = Join-Path $env:GITHUB_WORKSPACE "dist/windows/$env:KORNUCOPIA_RID"
          dotnet publish Windows/Kornucopia.Windows.csproj -c Release -r $env:KORNUCOPIA_RID --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false -p:ContinuousIntegrationBuild=true "-p:PathMap=$env:GITHUB_WORKSPACE=/_/Kornucopia" -o $output
          if ($LASTEXITCODE -ne 0) { throw 'Windows publish failed.' }
      - name: Verify portable files and executable architecture
        env:
          KORNUCOPIA_RID: ${{ matrix.rid }}
          KORNUCOPIA_MACHINE: ${{ matrix.pe_machine }}
        run: |
          $output = Join-Path $env:GITHUB_WORKSPACE "dist/windows/$env:KORNUCOPIA_RID"
          $expected = @('Kornucopia.exe', 'Resources/Localization/en.json', 'Resources/Localization/es.json', 'Resources/Localization/fr.json', 'Resources/Localization/ja.json', 'Resources/Localization/pt-BR.json', 'Resources/RuntimeNotices/dotnet-runtime-LICENSE.TXT', 'Resources/RuntimeNotices/dotnet-runtime-THIRD-PARTY-NOTICES.TXT', 'Resources/RuntimeNotices/windowsdesktop-LICENSE.txt', 'Resources/RuntimeNotices/SOURCES.json') | Sort-Object
          $files = @(Get-ChildItem $output -Recurse -File)
          $actual = @($files | ForEach-Object { [IO.Path]::GetRelativePath($output, $_.FullName).Replace([char]92, [char]47) }) | Sort-Object
          if (Compare-Object $expected $actual) { throw 'Unexpected or missing portable files.' }
          if (Get-ChildItem $output -Recurse | Where-Object { $_.Attributes -band [IO.FileAttributes]::ReparsePoint }) { throw 'Portable output contains symbolic links.' }
          $exe = Join-Path $output 'Kornucopia.exe'
          $stream = [IO.File]::OpenRead($exe)
          $reader = [IO.BinaryReader]::new($stream)
          try {
            if ($reader.ReadUInt16() -ne 0x5a4d) { throw 'Missing PE executable header.' }
            $stream.Position = 0x3c
            $peOffset = $reader.ReadUInt32()
            $stream.Position = $peOffset
            if ($reader.ReadUInt32() -ne 0x4550 -or $reader.ReadUInt16() -ne [int]$env:KORNUCOPIA_MACHINE) { throw 'Executable architecture does not match release target.' }
          } finally { $reader.Dispose(); $stream.Dispose() }
          $bytes = [IO.File]::ReadAllBytes($exe)
          foreach ($text in @([Text.Encoding]::UTF8.GetString($bytes), [Text.Encoding]::Unicode.GetString($bytes))) {
            if ($text -match '/Users/|[A-Za-z]:\\Users\\[^\\\x00\r\n]+\\') { throw 'Executable contains a personal home path.' }
          }
          foreach ($locale in @('pt-BR', 'en', 'es', 'fr', 'ja')) {
            $source = Get-FileHash "Resources/Localization/$locale.json" -Algorithm SHA256
            $copy = Get-FileHash "$output/Resources/Localization/$locale.json" -Algorithm SHA256
            if ($source.Hash -ne $copy.Hash) { throw 'Published locale differs from source.' }
          }
          foreach ($notice in @('dotnet-runtime-LICENSE.TXT', 'dotnet-runtime-THIRD-PARTY-NOTICES.TXT', 'windowsdesktop-LICENSE.txt', 'SOURCES.json')) {
            $source = Get-FileHash "Windows/Resources/RuntimeNotices/$notice" -Algorithm SHA256
            $copy = Get-FileHash "$output/Resources/RuntimeNotices/$notice" -Algorithm SHA256
            if ($source.Hash -ne $copy.Hash) { throw 'Published runtime notice differs from source.' }
          }
          Write-Output 'PASS: strict portable allowlist, architecture, paths, locale copies and runtime notices'
      - name: WPF smoke test on Windows Server runner (x64)
        if: matrix.arch == 'x64'
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'dist/windows/win-x64/Kornucopia.exe'
          $smoke = Join-Path $env:RUNNER_TEMP 'Kornucopia-smoke'
          $stdout = Join-Path $env:RUNNER_TEMP 'Kornucopia-smoke-stdout.txt'
          $stderr = Join-Path $env:RUNNER_TEMP 'Kornucopia-smoke-stderr.txt'
          $process = Start-Process -FilePath $exe -ArgumentList '--smoke-test', $smoke -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          if (!$process.WaitForExit(120000)) { $process.Kill(); throw 'WPF smoke test timed out.' }
          if ($process.ExitCode -ne 0) {
            foreach ($diagnostic in @((Join-Path $smoke 'smoke-failure.txt'), $stdout, $stderr)) {
              if (Test-Path $diagnostic -PathType Leaf) {
                $text = [IO.File]::ReadAllText($diagnostic)
                if ($text.Length -gt 8000) { $text = $text.Substring(0, 8000) }
                $text = $text -replace '/Users/[^/\s]+', '<user-home>' -replace '[A-Za-z]:\\Users\\[^\\\s]+', '<user-home>' -replace 'gh[pousr]_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]+', '<credential>'
                Write-Output ('SYNTHETIC_SMOKE_DIAGNOSTIC ' + $text)
              }
            }
            throw ('WPF smoke test failed with exit code ' + $process.ExitCode)
          }
          foreach ($file in @('pt-BR.png', 'en.png', 'es.png', 'fr.png', 'ja.png', 'smoke-report.json')) {
            if (!(Test-Path (Join-Path $smoke $file))) { throw "WPF smoke evidence was not generated: $file" }
          }
      - name: Package verified Windows app
        env:
          KORNUCOPIA_ARCH: ${{ matrix.arch }}
          KORNUCOPIA_RID: ${{ matrix.rid }}
        run: |
          $output = Join-Path $env:GITHUB_WORKSPACE "dist/windows/$env:KORNUCOPIA_RID"
          $name = "Kornucopia-1.0.3-windows-$env:KORNUCOPIA_ARCH.zip"
          $zip = Join-Path $env:GITHUB_WORKSPACE "dist/$name"
          Compress-Archive -Path "$output/*" -DestinationPath $zip -CompressionLevel Optimal
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $name" | Set-Content "dist/SHA256SUMS-windows-$env:KORNUCOPIA_ARCH.txt" -Encoding utf8NoBOM
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [IO.Compression.ZipFile]::OpenRead($zip)
          try {
            $expected = @('Kornucopia.exe', 'Resources/Localization/en.json', 'Resources/Localization/es.json', 'Resources/Localization/fr.json', 'Resources/Localization/ja.json', 'Resources/Localization/pt-BR.json', 'Resources/RuntimeNotices/dotnet-runtime-LICENSE.TXT', 'Resources/RuntimeNotices/dotnet-runtime-THIRD-PARTY-NOTICES.TXT', 'Resources/RuntimeNotices/windowsdesktop-LICENSE.txt', 'Resources/RuntimeNotices/SOURCES.json') | Sort-Object
            $actual = @($archive.Entries | Where-Object { $_.Name -ne '' } | ForEach-Object { $_.FullName.Replace([char]92, [char]47) }) | Sort-Object
            if (Compare-Object $expected $actual) { throw 'ZIP allowlist failed.' }
          } finally { $archive.Dispose() }
      - name: Upload verified Windows release files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Kornucopia-1.0.3-windows-${{ matrix.arch }}
          path: |
            dist/Kornucopia-1.0.3-windows-${{ matrix.arch }}.zip
            dist/SHA256SUMS-windows-${{ matrix.arch }}.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          include-hidden-files: false
      - name: Upload isolated WPF smoke evidence
        if: matrix.arch == 'x64' && always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Windows-Server-WPF-smoke
          path: |
            ${{ runner.temp }}/Kornucopia-smoke/pt-BR.png
            ${{ runner.temp }}/Kornucopia-smoke/en.png
            ${{ runner.temp }}/Kornucopia-smoke/es.png
            ${{ runner.temp }}/Kornucopia-smoke/fr.png
            ${{ runner.temp }}/Kornucopia-smoke/ja.png
            ${{ runner.temp }}/Kornucopia-smoke/smoke-report.json
          if-no-files-found: ignore
          retention-days: 7
          include-hidden-files: false

  publish-release:
    name: Prepare draft release and Windows visual evidence
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release && github.ref == 'refs/heads/main'
    needs: [macos, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: kornucopia-release-v1.0.3
      cancel-in-progress: false
    steps:
      - name: Checkout release notes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download verified macOS files from this run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Kornucopia-1.0.3-macOS-arm64
          path: release-assets/macOS-arm64
      - name: Download verified Windows x64 files from this run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Kornucopia-1.0.3-windows-x64
          path: release-assets/windows-x64
      - name: Download verified Windows ARM64 files from this run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Kornucopia-1.0.3-windows-arm64
          path: release-assets/windows-arm64
      - name: Download synthetic Windows visual evidence from this run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Windows-Server-WPF-smoke
          path: windows-evidence
      - name: Windows visual evidence
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, json, re, struct

          root = Path('windows-evidence')
          locales = ('pt-BR', 'en', 'es', 'fr', 'ja')
          expected = {f'{locale}.png' for locale in locales} | {'smoke-report.json'}
          entries = list(root.rglob('*'))
          if any(path.is_symlink() for path in entries) or {path.relative_to(root).as_posix() for path in entries if path.is_file()} != expected:
              raise SystemExit('Unexpected or missing synthetic visual evidence.')
          report = json.loads((root / 'smoke-report.json').read_text(encoding='utf-8'))
          fields = {'passed', 'version', 'checks', 'languages', 'operatingSystem', 'scope', 'dataIsolation'}
          if set(report) != fields or report['passed'] is not True or report['version'] != '1.0.3' or set(report['languages']) != set(locales):
              raise SystemExit('Synthetic WPF smoke report failed validation.')
          compact = json.dumps(report, ensure_ascii=False, separators=(',', ':'))
          if len(compact) > 20000 or re.search(r'/Users/|/home/|[A-Za-z]:\\Users\\|gh[pousr]_[A-Za-z0-9]{30,}|github_pat_', compact):
              raise SystemExit('Synthetic WPF report contains unexpected private content.')
          print('BEGIN_KORNUCOPIA_SMOKE_REPORT')
          print(compact)
          print('END_KORNUCOPIA_SMOKE_REPORT')
          for locale in locales:
              data = (root / f'{locale}.png').read_bytes()
              if not 24 <= len(data) <= 2000000 or data[:8] != b'\x89PNG\r\n\x1a\n' or data[12:16] != b'IHDR':
                  raise SystemExit('Invalid synthetic PNG evidence.')
              width, height = struct.unpack('>II', data[16:24])
              if not (1 <= width <= 4096 and 1 <= height <= 4096):
                  raise SystemExit('Unexpected synthetic PNG dimensions.')
              print(f'KORNUCOPIA_PNG_INFO {locale} bytes={len(data)} sha256={hashlib.sha256(data).hexdigest()}')
              print(f'BEGIN_KORNUCOPIA_PNG {locale}')
              encoded = base64.b64encode(data).decode('ascii')
              for offset in range(0, len(encoded), 1024):
                  print(encoded[offset:offset + 1024])
              print(f'END_KORNUCOPIA_PNG {locale}')
          PY
      - name: Verify six assets and create draft only
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, os, re, subprocess

          tag = 'v1.0.3'
          repo = os.environ['GH_REPO']
          pairs = (
              ('macOS-arm64', 'Kornucopia-v1.0.3-macOS-arm64.zip', 'SHA256SUMS.txt'),
              ('windows-x64', 'Kornucopia-1.0.3-windows-x64.zip', 'SHA256SUMS-windows-x64.txt'),
              ('windows-arm64', 'Kornucopia-1.0.3-windows-arm64.zip', 'SHA256SUMS-windows-arm64.txt'),
          )
          assets = []
          expected = {}
          for directory, archive, checksum in pairs:
              folder = Path('release-assets') / directory
              entries = list(folder.rglob('*'))
              if any(path.is_symlink() for path in entries) or {path.relative_to(folder).as_posix() for path in entries if path.is_file()} != {archive, checksum}:
                  raise SystemExit('Release artifact allowlist failed.')
              checksum_path = folder / checksum
              match = re.fullmatch(r'([0-9a-f]{64})  ' + re.escape(archive) + r'\r?\n?', checksum_path.read_text(encoding='utf-8'))
              archive_path = folder / archive
              digest = hashlib.file_digest(archive_path.open('rb'), 'sha256').hexdigest()
              if not match or match[1] != digest:
                  raise SystemExit('Release archive checksum failed.')
              for path in (archive_path, checksum_path):
                  with path.open('rb') as stream:
                      expected[path.name] = (path.stat().st_size, 'sha256:' + hashlib.file_digest(stream, 'sha256').hexdigest())
                  assets.append(str(path))
              print(f'PASS SHA256 {archive}: {digest}')
          if len(expected) != 6:
              raise SystemExit('Exactly six unique distribution assets are required.')

          def api_pages(endpoint):
              result = subprocess.run(['gh', 'api', '--paginate', '--slurp', f'repos/{repo}/{endpoint}?per_page=100'], capture_output=True, text=True)
              if result.returncode:
                  raise RuntimeError('GitHub API request failed; no existing release will be changed.')
              return [item for page in json.loads(result.stdout) for item in page]

          def release_state(release):
              draft = str(release['draft']).lower()
              print(f"RELEASE_STATE tag={tag} id={release['id']} draft={draft} assets={len(release['assets'])} url={release['html_url']}")
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
                  summary.write(f"\nRelease `{tag}`: ID `{release['id']}`, draft `{draft}`, assets `{len(release['assets'])}`. [Inspect release]({release['html_url']}).\n")
              with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
                  output.write(f"release_id={release['id']}\ndraft={draft}\nrelease_url={release['html_url']}\n")

          existing = [release for release in api_pages('releases') if release['tag_name'] == tag]
          if existing:
              release_state(existing[0])
              raise SystemExit('Release or draft already exists. Inspect it manually; it will not be overwritten.')
          if any(item['name'] == tag for item in api_pages('tags')):
              raise SystemExit('Release tag already exists. Inspect it manually before creating a release.')

          result = subprocess.run(['gh', 'release', 'create', tag, *assets, '--draft', '--target', os.environ['GITHUB_SHA'], '--title', 'Kornucopia 1.0.3', '--notes-file', 'docs/release-1.0.3.pt-BR.md'], capture_output=True, text=True)
          releases = [release for release in api_pages('releases') if release['tag_name'] == tag]
          if releases:
              release_state(releases[0])
          if result.returncode or len(releases) != 1:
              raise SystemExit('Draft creation did not complete. Inspect the release status above; do not retry or overwrite automatically.')
          release = releases[0]
          remote = release['assets']
          if release['draft'] is not True or release['target_commitish'] != os.environ['GITHUB_SHA'] or len(remote) != 6 or {asset['name'] for asset in remote} != set(expected):
              raise SystemExit('Draft metadata or six-asset allowlist failed. Preserve the draft for manual inspection.')
          for asset in remote:
              size, digest = expected[asset['name']]
              if asset['state'] != 'uploaded' or asset['size'] != size or asset.get('digest') != digest:
                  raise SystemExit('Uploaded asset verification failed. Preserve the draft for manual inspection.')
          print('PASS: draft v1.0.3 contains exactly six verified distribution assets. Publication remains a manual UI action after visual review.')
          PY
